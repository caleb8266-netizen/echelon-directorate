function CharacterArcSheet({ story, onUpdate, onClose, initialTab="characters" }) {
  const [tab,           setTab]           = useState(initialTab);
  const [characters,    setCharacters]    = useState(story.characters||[]);
  const [storyArcId,    setStoryArcId]    = useState(story.storyArcId||null);
  const [storyArcNotes, setStoryArcNotes] = useState(story.storyArcNotes||{});
  const [activeChar,    setActiveChar]    = useState(null);
  const [activeBeat,    setActiveBeat]    = useState(null);
  const [addingChar,    setAddingChar]    = useState(false);
  const [newCharName,   setNewCharName]   = useState("");
  const charId = useRef(Date.now()+77000);

  const saveCharacters = (next) => { setCharacters(next); onUpdate({ characters:next }); };
  const saveStoryArc   = (arcId) => { setStoryArcId(arcId); onUpdate({ storyArcId:arcId }); };
  const saveBeatNote   = (arcId, beatIndex, text) => {
    const key  = `${arcId}_${beatIndex}`;
    const next = { ...storyArcNotes, [key]:text };
    setStoryArcNotes(next);
    onUpdate({ storyArcNotes:next });
  };

  const addCharacter = (templateKey) => {
    if (!newCharName.trim()) return;
    const template = ARC_TEMPLATES[templateKey];
    const fields   = Object.fromEntries(template.fields.map(f=>[f.id,""]));
    const ch = { id:charId.current++, name:newCharName.trim().toUpperCase(), template:templateKey, fields };
    const next = [...characters, ch];
    saveCharacters(next);
    setActiveChar(ch);
    setAddingChar(false);
    setNewCharName("");
  };

  const deleteCharacter = (id) => {
    const next = characters.filter(c=>c.id!==id);
    saveCharacters(next);
    if (activeChar && activeChar.id===id) setActiveChar(null);
  };

  const updateField = (fieldId, value) => {
    const updated = { ...activeChar, fields:{ ...activeChar.fields, [fieldId]:value } };
    const next    = characters.map(c=>c.id===updated.id?updated:c);
    setCharacters(next);
    onUpdate({ characters:next });
    setActiveChar(updated);
  };

  const selectedArc = STORY_ARCS.find(a=>a.id===storyArcId);

  // ── Beat note editor ──
  if (activeBeat) {
    const arc  = STORY_ARCS.find(a=>a.id===activeBeat.arcId);
    const beat = arc && arc.beats[activeBeat.beatIndex];
    const key  = `${activeBeat.arcId}_${activeBeat.beatIndex}`;
    return (
      <div style={{ position:"absolute", inset:0, background:C.bg, zIndex:400, display:"flex", flexDirection:"column", animation:"fadeIn 0.18s ease both" }}>
        <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"12px 18px", paddingTop:"max(12px,env(safe-area-inset-top,12px))", display:"flex", alignItems:"center", gap:12, flexShrink:0 }}>
          <button onClick={()=>setActiveBeat(null)} style={{ background:"transparent", border:"none", color:C.blue, fontSize:13, cursor:"pointer", letterSpacing:"0.1em", padding:0, flexShrink:0 }}>
            ‹ BACK
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:14, fontWeight:700, color:arc && arc.color||C.amber, letterSpacing:"0.15em" }}>{beat && beat.beat}</div>
            <div style={{ fontSize:8, color:C.muted, letterSpacing:"0.1em", marginTop:1 }}>p. {beat && beat.page} · {arc && arc.label}</div>
          </div>
        </div>
        <div style={{ padding:"14px 18px 10px", background:"rgba(255,255,255,0.02)", borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
          <p style={{ fontSize:12, color:C.greyLight, fontStyle:"italic", lineHeight:1.6 }}>{beat && beat.hint}</p>
        </div>
        <textarea
          value={storyArcNotes[key]||""}
          onChange={e=>saveBeatNote(activeBeat.arcId, activeBeat.beatIndex, e.target.value)}
          autoFocus
          placeholder={`Write your notes for "${beat && beat.beat}" here...`}
          style={{ flex:1, minHeight:0, width:"100%", background:"transparent", border:"none", resize:"none", color:C.white, fontFamily:"'Special Elite',serif", fontSize:16, lineHeight:1.9, padding:"22px 22px", outline:"none", overflowY:"scroll", WebkitOverflowScrolling:"touch", paddingBottom:"max(30px,env(safe-area-inset-bottom,30px))" }}
        />
        <div style={{ background:C.panel, borderTop:`1px solid ${C.border}`, padding:"6px 18px", paddingBottom:"max(6px,env(safe-area-inset-bottom,6px))", fontSize:9, color:C.muted, textAlign:"right", letterSpacing:"0.1em", flexShrink:0 }}>
          {(storyArcNotes[key]||"").split(/\s+/).filter(Boolean).length} words
        </div>
      </div>
    );
  }

  // ── Character full profile ──
  if (activeChar) {
    const template   = ARC_TEMPLATES[activeChar.template]||ARC_TEMPLATES.simple_arc;
    const arc        = STORY_ARCS.find(a=>a.id===storyArcId);
    const charNotes  = activeChar.beatNotes||{};

    const updateBeatNote = (beatIndex, text) => {
      const updated = { ...activeChar, beatNotes:{ ...charNotes, [beatIndex]:text } };
      const next    = characters.map(c=>c.id===updated.id?updated:c);
      setCharacters(next);
      onUpdate({ characters:next });
      setActiveChar(updated);
    };

    return (
      <div style={{ position:"absolute", inset:0, background:C.bg, zIndex:300, display:"flex", flexDirection:"column", animation:"fadeIn 0.18s ease both" }}>
        {/* Header */}
        <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"12px 18px", paddingTop:"max(12px,env(safe-area-inset-top,12px))", display:"flex", alignItems:"center", gap:12, flexShrink:0 }}>
          <button onClick={()=>setActiveChar(null)} style={{ background:"transparent", border:"none", color:C.blue, fontSize:13, cursor:"pointer", letterSpacing:"0.1em", padding:0, flexShrink:0 }}>‹ BACK</button>
          <div style={{ flex:1, minWidth:0 }}>
            <input
              value={activeChar.name}
              onChange={e=>{
                const updated = { ...activeChar, name:e.target.value.toUpperCase() };
                const next = characters.map(c=>c.id===updated.id?updated:c);
                setCharacters(next);
                onUpdate({ characters:next });
                setActiveChar(updated);
              }}
              style={{ background:"transparent", border:"none", borderBottom:`1px solid ${C.amber}44`, outline:"none", fontFamily:"'Rajdhani',sans-serif", fontSize:16, fontWeight:700, color:C.amber, letterSpacing:"0.2em", width:"100%", padding:"2px 0" }}
            />
            <div style={{ fontSize:8, color:C.muted, letterSpacing:"0.15em", marginTop:3 }}>{template.label} · tap name to edit</div>
          </div>
          <button onClick={()=>deleteCharacter(activeChar.id)}
            style={{ background:"transparent", border:`1px solid ${C.red}44`, borderRadius:7, padding:"4px 9px", color:C.red, fontSize:9, letterSpacing:"0.1em", cursor:"pointer" }}>
            REMOVE
          </button>
        </div>

        {/* Scrollable profile body */}
        <div style={{ flex:1, minHeight:0, overflowY:"auto", WebkitOverflowScrolling:"touch", padding:"20px 18px 50px" }}>

          {/* ── ARC TEMPLATE FIELDS ── */}
          <div style={{ fontSize:9, color:C.grey, letterSpacing:"0.22em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600, marginBottom:14 }}>CHARACTER PROFILE</div>
          {template.fields.map(f=>(
            <div key={f.id} style={{ marginBottom:16 }}>
              <div style={{ fontSize:9, color:C.amber, letterSpacing:"0.2em", fontFamily:"'Rajdhani',sans-serif", fontWeight:700, marginBottom:5 }}>{f.label}</div>
              <textarea value={activeChar.fields[f.id]||""} onChange={e=>updateField(f.id, e.target.value)} placeholder={f.hint} rows={2}
                style={{ width:"100%", background:"rgba(255,255,255,0.03)", border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.white, fontFamily:"'Special Elite',serif", fontSize:14, lineHeight:1.8, outline:"none", resize:"none" }}/>
            </div>
          ))}

          {/* ── STORY ARC BEAT NOTES FOR THIS CHARACTER ── */}
          {arc && (
            <>
              <div style={{ height:1, background:C.border, margin:"22px 0 18px" }}/>
              <div style={{ fontSize:9, color:C.grey, letterSpacing:"0.22em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600, marginBottom:6 }}>
                {arc.label} — CHARACTER MOMENTS
              </div>
              <div style={{ fontSize:10, color:C.muted, fontStyle:"italic", marginBottom:14, lineHeight:1.5 }}>
                What is {activeChar.name} thinking, feeling, or doing at each beat?
              </div>
              {arc.beats.map((beat,i)=>{
                const note = charNotes[i]||"";
                return (
                  <div key={i} style={{ marginBottom:14 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:5 }}>
                      <div style={{ width:20, height:20, borderRadius:5, background:note?`${arc.color}22`:"rgba(255,255,255,0.04)", border:`1px solid ${note?arc.color:C.border}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                        <span style={{ fontSize:8, color:note?arc.color:C.muted, fontFamily:"'Rajdhani',sans-serif", fontWeight:700 }}>{i+1}</span>
                      </div>
                      <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:11, fontWeight:700, color:note?arc.color:C.greyLight, letterSpacing:"0.1em" }}>{beat.beat}</div>
                      <div style={{ fontSize:8, color:C.muted, marginLeft:"auto" }}>p. {beat.page}</div>
                    </div>
                    <textarea value={note} onChange={e=>updateBeatNote(i, e.target.value)}
                      placeholder={beat.hint}
                      rows={2}
                      style={{ width:"100%", background:"rgba(255,255,255,0.02)", border:`1px solid ${note?arc.color+"44":C.border}`, borderRadius:8, padding:"9px 12px", color:C.white, fontFamily:"'Special Elite',serif", fontSize:14, lineHeight:1.7, outline:"none", resize:"none" }}/>
                  </div>
                );
              })}
            </>
          )}

          {/* If no story arc selected yet */}
          {!arc && (
            <>
              <div style={{ height:1, background:C.border, margin:"22px 0 18px" }}/>
              <div style={{ background:"rgba(255,255,255,0.02)", border:`1px solid ${C.border}`, borderRadius:10, padding:"16px", textAlign:"center" }}>
                <div style={{ fontSize:10, color:C.muted, letterSpacing:"0.1em", marginBottom:6 }}>NO STORY ARC SELECTED</div>
                <div style={{ fontSize:11, color:C.muted, fontStyle:"italic", lineHeight:1.5 }}>Go to the STORY ARC tab to pick a structure — then each beat will appear here so you can track what {activeChar.name} is doing at every moment.</div>
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  // ── Main sheet ──
  return (
    <BottomSheet title="CHARACTER ARCS" onClose={onClose}>
      {/* Tab switcher */}
      <div style={{ display:"flex", marginBottom:16, background:"rgba(255,255,255,0.03)", borderRadius:10, padding:3 }}>
        {[{id:"characters",label:"CHARACTERS"},{id:"story_arc",label:"STORY ARC"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{ flex:1, padding:"8px 0", background:tab===t.id?C.blueFaint:"transparent", border:`1px solid ${tab===t.id?C.blue:"transparent"}`, borderRadius:8, color:tab===t.id?C.blue:C.grey, fontSize:10, letterSpacing:"0.12em", cursor:"pointer", fontFamily:"'Rajdhani',sans-serif", fontWeight:700, transition:"all 0.15s" }}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ── CHARACTERS TAB ── */}
      {tab==="characters" && (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {addingChar ? (
            <div style={{ animation:"fadeUp 0.15s ease both" }}>
              <div style={{ fontSize:9, color:C.grey, letterSpacing:"0.18em", marginBottom:8 }}>CHARACTER NAME</div>
              <input value={newCharName} onChange={e=>setNewCharName(e.target.value)} placeholder="e.g. ANA VOSS" autoFocus
                style={{ width:"100%", background:"rgba(255,255,255,0.05)", border:`1px solid ${C.blue}`, borderRadius:8, padding:"10px 12px", color:C.white, fontFamily:"'Rajdhani',sans-serif", fontSize:16, outline:"none", marginBottom:12, letterSpacing:"0.1em" }}/>
              <div style={{ fontSize:9, color:C.grey, letterSpacing:"0.18em", marginBottom:8 }}>CHOOSE TEMPLATE</div>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {Object.entries(ARC_TEMPLATES).map(([key,tmpl])=>(
                  <button key={key} onClick={()=>addCharacter(key)}
                    style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${C.borderBright}`, borderRadius:10, padding:"12px 16px", cursor:"pointer", textAlign:"left" }}>
                    <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700, color:C.amber, letterSpacing:"0.15em" }}>{tmpl.label}</div>
                    <div style={{ fontSize:10, color:C.muted, marginTop:3 }}>{tmpl.fields.map(f=>f.label).join(" · ")}</div>
                  </button>
                ))}
              </div>
              <button onClick={()=>setAddingChar(false)} style={{ width:"100%", background:"transparent", border:`1px solid ${C.border}`, borderRadius:8, padding:"10px", color:C.grey, fontSize:10, letterSpacing:"0.15em", cursor:"pointer", marginTop:10 }}>CANCEL</button>
            </div>
          ) : (
            <button onClick={()=>setAddingChar(true)} style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 14px", color:C.grey, fontSize:10, letterSpacing:"0.15em", cursor:"pointer" }}>
              + ADD CHARACTER
            </button>
          )}
          {characters.length===0 && !addingChar && (
            <p style={{ fontSize:11, color:C.muted, fontStyle:"italic", textAlign:"center", padding:"10px 0" }}>No characters yet. Tap + Add Character to start.</p>
          )}
          {characters.map(ch=>{
            const tmpl  = ARC_TEMPLATES[ch.template]||ARC_TEMPLATES.simple_arc;
            const filled = Object.values(ch.fields).filter(v=>v.trim()).length;
            const total  = tmpl.fields.length;
            return (
              <div key={ch.id} onClick={()=>setActiveChar(ch)}
                style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${C.border}`, borderRadius:10, padding:"14px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:15, fontWeight:700, color:C.amber, letterSpacing:"0.15em" }}>{ch.name}</div>
                  <div style={{ fontSize:9, color:C.muted, marginTop:3, letterSpacing:"0.1em" }}>{tmpl.label} · {filled}/{total} fields</div>
                  {filled>0 && (
                    <div style={{ height:2, background:C.blueFaint, borderRadius:1, overflow:"hidden", marginTop:7 }}>
                      <div style={{ height:"100%", width:`${(filled/total)*100}%`, background:`linear-gradient(90deg,${C.amberDim},${C.amber})` }}/>
                    </div>
                  )}
                </div>
                <span style={{ color:C.blue, fontSize:18 }}>›</span>
              </div>
            );
          })}
        </div>
      )}

      {/* ── STORY ARC TAB ── */}
      {tab==="story_arc" && (
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {!storyArcId ? (
            <>
              <p style={{ fontSize:11, color:C.muted, fontStyle:"italic", marginBottom:4, lineHeight:1.5 }}>
                Choose the story arc structure that fits this story. You can write notes for each beat.
              </p>
              {STORY_ARCS.map(arc=>(
                <button key={arc.id} onClick={()=>saveStoryArc(arc.id)}
                  style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${arc.color}44`, borderRadius:10, padding:"14px 16px", cursor:"pointer", textAlign:"left" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                    <div style={{ width:8, height:8, borderRadius:"50%", background:arc.color, flexShrink:0 }}/>
                    <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:14, fontWeight:700, color:arc.color, letterSpacing:"0.15em" }}>{arc.label}</div>
                  </div>
                  <div style={{ fontSize:9, color:C.muted, letterSpacing:"0.08em", marginBottom:4 }}>by {arc.author}</div>
                  <div style={{ fontSize:11, color:C.greyLight, lineHeight:1.5 }}>{arc.desc}</div>
                  <div style={{ fontSize:9, color:C.muted, marginTop:6 }}>{arc.beats.length} beats</div>
                </button>
              ))}
            </>
          ) : (
            <>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:4 }}>
                <div>
                  <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:14, fontWeight:700, color:selectedArc && selectedArc.color||C.amber, letterSpacing:"0.15em" }}>{selectedArc && selectedArc.label}</div>
                  <div style={{ fontSize:9, color:C.muted, letterSpacing:"0.08em", marginTop:2 }}>by {selectedArc && selectedArc.author} · {selectedArc && selectedArc.beats.length} beats</div>
                </div>
                <button onClick={()=>saveStoryArc(null)}
                  style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:7, padding:"4px 9px", color:C.grey, fontSize:9, letterSpacing:"0.1em", cursor:"pointer" }}>
                  CHANGE
                </button>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                {selectedArc && selectedArc.beats.map((beat,i)=>{
                  const key  = `${storyArcId}_${i}`;
                  const note = storyArcNotes[key]||"";
                  const words = note.split(/\s+/).filter(Boolean).length;
                  return (
                    <div key={i} onClick={()=>setActiveBeat({ arcId:storyArcId, beatIndex:i })}
                      style={{ background:note?"rgba(79,195,247,0.05)":"rgba(255,255,255,0.03)", border:`1px solid ${note?C.borderBright:C.border}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:26, height:26, borderRadius:6, background:note?`${selectedArc.color}22`:"rgba(255,255,255,0.04)", border:`1px solid ${note?selectedArc.color:C.border}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                        <span style={{ fontSize:9, color:note?selectedArc.color:C.muted, fontFamily:"'Rajdhani',sans-serif", fontWeight:700 }}>{i+1}</span>
                      </div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:12, fontWeight:700, color:note?C.white:C.greyLight, letterSpacing:"0.1em" }}>{beat.beat}</div>
                        <div style={{ fontSize:9, color:C.muted, marginTop:2 }}>
                          {note ? `${words}w · p. ${beat.page}` : `p. ${beat.page} · tap to write`}
                        </div>
                      </div>
                      <span style={{ color:note?C.blue:C.muted, fontSize:16 }}>›</span>
                    </div>
                  );
                })}
              </div>
              {selectedArc && (()=>{
                const filled = selectedArc.beats.filter((_,i)=>storyArcNotes[`${storyArcId}_${i}`] && storyArcNotes[`${storyArcId}_${i}`].trim()).length;
                const total  = selectedArc.beats.length;
                return filled>0 ? (
                  <div style={{ marginTop:4 }}>
                    <div style={{ fontSize:9, color:C.muted, letterSpacing:"0.1em", marginBottom:5 }}>{filled}/{total} BEATS WRITTEN</div>
                    <div style={{ height:2, background:C.blueFaint, borderRadius:1, overflow:"hidden" }}>
                      <div style={{ height:"100%", width:`${(filled/total)*100}%`, background:`linear-gradient(90deg,${selectedArc.color}88,${selectedArc.color})` }}/>
                    </div>
                  </div>
                ) : null;
              })()}
            </>
          )}
        </div>
      )}
    </BottomSheet>
  );
}

function DossierDetail({ story, onChange, onBack, onDelete }) {
  const [activeSheet,   setActiveSheet]   = useState(null);
  const [arcTab,        setArcTab]        = useState("characters");
  const [activeSection, setActiveSection] = useState(null);
  const [activeChapter, setActiveChapter] = useState(null);
  const [addingSection, setAddingSection] = useState(false);
  const [newSecTitle,   setNewSecTitle]   = useState("");
  const secCounter = useRef(Date.now()+50000);

  // Migrate old plain-text content into sections on first open — runs once
  const migrated = useRef(false);
  useEffect(() => {
    if (!story.sections && !migrated.current) {
      migrated.current = true;
      const defaults = DEFAULT_SECTIONS.map(s=>({...s}));
      if (story.content) defaults[4] = { ...defaults[4], content:story.content };
      onChange({ ...story, sections:defaults, updatedAt:new Date().toISOString() });
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const sections = story.sections || DEFAULT_SECTIONS.map(s=>({...s}));

  const update = useCallback((fields) => {
    onChange({ ...story, ...fields, updatedAt:new Date().toISOString() });
  }, [story, onChange]);

  const saveSection = (updated) => {
    const newSections = sections.map(s=>s.id===updated.id?updated:s);
    update({ sections:newSections });
    setActiveSection(null);
  };

  const addSection = () => {
    if (!newSecTitle.trim()) return;
    const newSec = { id:`s${secCounter.current++}`, title:newSecTitle.trim().toUpperCase(), content:"" };
    update({ sections:[...sections, newSec] });
    setNewSecTitle(""); setAddingSection(false);
  };

  const deleteSection = (id) => {
    update({ sections:sections.filter(s=>s.id!==id) });
  };

  const chapDone  = story.chapters && story.chapters.filter(c=>c.done).length||0;
  const chapTotal = story.chapters && story.chapters.length||0;
  const statusColor = STATUS_COLORS[story.status]||C.grey;
  const totalWords = sections.reduce((acc,s)=>acc+(s.content||"").split(/\s+/).filter(Boolean).length,0);

  const saveChapterFromDetail = (updated) => {
    update({ chapters:story.chapters.map(c=>c.id===updated.id?updated:c) });
    setActiveChapter(null);
  };

  const openSheet  = (name) => setActiveSheet(name);
  const closeSheet = ()     => setActiveSheet(null);

  // Chapter writer open — full screenplay format
  if (activeChapter) {
    return <ScreenplayWriter chapter={activeChapter} onSave={saveChapterFromDetail}/>;
  }

  // Section writer open
  if (activeSection) {
    return <SectionWriter section={activeSection} onSave={saveSection} onBack={()=>setActiveSection(null)}/>;
  }

  return (
    <>
      {activeSheet==="chapters"   && <ChaptersSheet    story={story} onUpdate={update} onClose={closeSheet}/>}
      {activeSheet==="evidence"   && <EvidenceSheet    story={story} onUpdate={update} onClose={closeSheet}/>}
      {activeSheet==="info"       && <InfoSheet        story={story} onUpdate={update} onClose={closeSheet}/>}
      {activeSheet==="characters" && <CharacterArcSheet story={story} onUpdate={update} onClose={closeSheet} initialTab={arcTab}/>}

      <div style={{ position:"absolute", inset:0, background:C.bg, display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* ── Top bar ── */}
        <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"10px 16px", paddingTop:"max(10px,env(safe-area-inset-top,10px))", display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
          <button onClick={onBack}
            style={{ background:"transparent", border:"none", color:C.blue, fontSize:13, cursor:"pointer", letterSpacing:"0.1em", padding:0, flexShrink:0 }}>
            ‹ ARCHIVE
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Special Elite',serif", fontSize:15, color:C.white, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{story.title}</div>
            <div style={{ display:"flex", gap:6, alignItems:"center", marginTop:2 }}>
              <span style={{ fontSize:8, color:statusColor, letterSpacing:"0.1em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600 }}>{story.status}</span>
              <span style={{ fontSize:8, color:C.muted }}>·</span>
              <span style={{ fontSize:8, color:C.muted }}>{story.genre}</span>
              <span style={{ fontSize:8, color:C.muted }}>·</span>
              <span style={{ fontSize:8, color:C.muted }}>{totalWords}w total</span>
            </div>
          </div>
          <button onClick={()=>openSheet("info")}
            style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:6, padding:"5px 10px", color:C.grey, fontSize:9, letterSpacing:"0.1em", cursor:"pointer", flexShrink:0 }}>
            INFO
          </button>
        </div>

        {/* Word count goal progress bar */}
        {story.wordGoal>0 && (()=>{
          const pct = Math.min(100, Math.round((totalWords/story.wordGoal)*100));
          return (
            <div style={{ padding:"6px 16px 8px", background:C.panel, borderBottom:`1px solid ${C.border}` }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:8, color:C.muted, letterSpacing:"0.1em", marginBottom:4 }}>
                <span>WORD GOAL</span>
                <span>{totalWords.toLocaleString()} / {story.wordGoal.toLocaleString()} — {pct}%</span>
              </div>
              <div style={{ height:3, background:C.blueFaint, borderRadius:2, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${pct}%`, background:pct>=100?`linear-gradient(90deg,${C.green},#70dd80)`:`linear-gradient(90deg,${C.blueDim},${C.blue})`, transition:"width 0.4s" }}/>
              </div>
            </div>
          );
        })()}

        {/* ── Scrollable body ── */}
        <div style={{ flex:1, minHeight:0, overflowY:"auto", WebkitOverflowScrolling:"touch", position:"relative" }}>

          {/* ── SECTIONS ── */}
          <div style={{ padding:"16px 16px 8px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
              <span style={{ fontSize:9, color:C.grey, letterSpacing:"0.22em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600 }}>FIELD NOTES</span>
              <button onClick={()=>setAddingSection(v=>!v)}
                style={{ background:addingSection?C.blueFaint:"transparent", border:`1px solid ${addingSection?C.blue:C.border}`, borderRadius:8, padding:"4px 10px", color:addingSection?C.blue:C.grey, fontSize:9, letterSpacing:"0.1em", cursor:"pointer" }}>
                {addingSection?"CANCEL":"+ SECTION"}
              </button>
            </div>

            {addingSection && (
              <div style={{ display:"flex", gap:7, marginBottom:10, animation:"fadeUp 0.15s ease both" }}>
                <input value={newSecTitle} onChange={e=>setNewSecTitle(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addSection()} placeholder="Section name..." autoFocus
                  style={{ flex:1, background:"rgba(255,255,255,0.05)", border:`1px solid ${C.blue}`, borderRadius:8, padding:"9px 12px", color:C.white, fontSize:13, outline:"none" }}/>
                <button onClick={addSection}
                  style={{ background:C.blue, border:"none", borderRadius:8, padding:"9px 14px", color:C.bg, fontSize:16, fontWeight:700, cursor:"pointer" }}>+</button>
              </div>
            )}

            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {sections.map(sec => {
                const wc = (sec.content||"").split(/\s+/).filter(Boolean).length;
                // CHARACTERS section opens the arc sheet instead of section writer
                if (sec.title==="CHARACTERS") {
                  return (
                    <div key={sec.id} onClick={()=>{ setArcTab("characters"); openSheet("characters"); }}
                      style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${C.amber}44`, borderRadius:12, padding:"14px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:12, transition:"all 0.12s" }}>
                      <div style={{ width:3, alignSelf:"stretch", background:C.amber, borderRadius:2, flexShrink:0, opacity:0.7 }}/>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700, color:C.amber, letterSpacing:"0.2em" }}>CHARACTERS</div>
                        {(story.characters||[]).length>0 ? (
                          <>
                            {(story.characters||[]).slice(0,3).map(ch=>(
                              <div key={ch.id} style={{ fontSize:12, color:C.greyLight, marginTop:4, fontFamily:"'Special Elite',serif" }}>— {ch.name}</div>
                            ))}
                            {(story.characters||[]).length>3 && (
                              <div style={{ fontSize:10, color:C.muted, marginTop:3, fontStyle:"italic" }}>+{(story.characters||[]).length-3} more</div>
                            )}
                          </>
                        ) : (
                          <div style={{ fontSize:11, color:C.muted, marginTop:4, fontStyle:"italic" }}>Tap to add characters...</div>
                        )}
                      </div>
                      <span style={{ color:C.blue, fontSize:18 }}>›</span>
                    </div>
                  );
                }
                return (
                  <div key={sec.id} onClick={()=>setActiveSection(sec)}
                    style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${sec.content?C.borderBright:C.border}`, borderRadius:12, padding:"14px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:12, transition:"all 0.12s" }}>
                    {/* Left accent */}
                    <div style={{ width:3, alignSelf:"stretch", background:sec.content?C.amber:C.muted, borderRadius:2, flexShrink:0, opacity:0.7 }}/>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700, color:sec.content?C.amber:C.greyLight, letterSpacing:"0.2em" }}>
                        {sec.title}
                      </div>
                      {sec.content ? (
                        <div style={{ fontSize:12, color:C.greyLight, marginTop:5, lineHeight:1.5, fontFamily:"'Special Elite',serif", overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>
                          {sec.content}
                        </div>
                      ) : (
                        <div style={{ fontSize:11, color:C.muted, marginTop:4, fontStyle:"italic" }}>
                          Tap to write...
                        </div>
                      )}
                      {wc>0 && <div style={{ fontSize:8, color:C.muted, marginTop:5, letterSpacing:"0.08em" }}>{wc} words</div>}
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
                      <span style={{ color:C.blue, fontSize:18 }}>›</span>
                      <button onClick={e=>{e.stopPropagation();if(window.confirm(`Delete "${sec.title}"?`))deleteSection(sec.id);}}
                        style={{ background:"transparent", border:"none", color:C.muted, cursor:"pointer", fontSize:14, lineHeight:1, padding:0 }}>×</button>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* ── STORY ARC shortcut card ── */}
            <div onClick={()=>{ setArcTab("story_arc"); openSheet("characters"); }}
              style={{ margin:"8px 0 0", background:"rgba(79,195,247,0.04)", border:`1px solid ${story.storyArcId?C.blueDim:C.border}`, borderRadius:12, padding:"14px 16px", cursor:"pointer", display:"flex", alignItems:"center", gap:12, transition:"all 0.12s" }}>
              <div style={{ width:3, alignSelf:"stretch", background:story.storyArcId?C.blue:C.muted, borderRadius:2, flexShrink:0, opacity:0.7 }}/>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700, color:story.storyArcId?C.blue:C.greyLight, letterSpacing:"0.2em" }}>STORY ARC</div>
                {story.storyArcId ? (
                  <div style={{ fontSize:12, color:C.greyLight, marginTop:4, fontFamily:"'Special Elite',serif" }}>
                    {(STORY_ARCS.find(a=>a.id===story.storyArcId)||{label:"Arc selected"}).label}
                  </div>
                ) : (
                  <div style={{ fontSize:11, color:C.muted, marginTop:4, fontStyle:"italic" }}>Tap to choose your story structure...</div>
                )}
              </div>
              <span style={{ color:story.storyArcId?C.blue:C.muted, fontSize:18 }}>›</span>
            </div>
          </div>

          {/* ── CHAPTERS — big and prominent ── */}
          <div style={{ padding:"16px 16px 40px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
              <span style={{ fontSize:9, color:C.grey, letterSpacing:"0.22em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600 }}>
                CHAPTERS {chapTotal>0?`— ${chapDone}/${chapTotal} COMPLETE`:""}
              </span>
              <button onClick={()=>openSheet("chapters")}
                style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:8, padding:"4px 10px", color:C.grey, fontSize:9, letterSpacing:"0.1em", cursor:"pointer" }}>
                + ADD / MANAGE
              </button>
            </div>

            {chapTotal>0 && (
              <div style={{ height:3, background:C.blueFaint, borderRadius:2, overflow:"hidden", marginBottom:14 }}>
                <div style={{ height:"100%", width:`${(chapDone/chapTotal)*100}%`, background:`linear-gradient(90deg,${C.blueDim},${C.blue})`, transition:"width 0.3s" }}/>
              </div>
            )}

            {chapTotal===0 ? (
              <div onClick={()=>openSheet("chapters")}
                style={{ border:`1.5px dashed ${C.border}`, borderRadius:12, padding:"22px 20px", textAlign:"center", cursor:"pointer" }}>
                <div style={{ fontSize:9, color:C.muted, letterSpacing:"0.2em" }}>NO CHAPTERS YET</div>
                <div style={{ fontSize:11, color:C.muted, marginTop:5, fontStyle:"italic" }}>Tap to add your first chapter</div>
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {story.chapters.map(ch=>(
                  <div key={ch.id} onClick={()=>setActiveChapter({
                      ...ch,
                      blocks: ch.blocks && ch.blocks.length>0
                        ? ch.blocks
                        : ch.content
                          ? [{ id:Date.now(), type:"action", text:ch.content }]
                          : [{ id:Date.now(), type:"scene",  text:"" }],
                    })}
                    style={{ background:ch.done?"rgba(79,195,247,0.06)":"rgba(255,255,255,0.03)", border:`1px solid ${ch.done?C.blueDim:C.border}`, borderRadius:14, padding:"16px 18px", cursor:"pointer", display:"flex", alignItems:"center", gap:14 }}>
                    {/* Big checkbox */}
                    <div style={{ width:24, height:24, border:`2px solid ${ch.done?C.blue:C.muted}`, borderRadius:6, background:ch.done?C.blue:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, transition:"all 0.15s" }}>
                      {ch.done && <span style={{ color:C.bg, fontSize:13, fontWeight:900 }}>✓</span>}
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"'Special Elite',serif", fontSize:16, color:ch.done?C.greyLight:C.white, textDecoration:ch.done?"line-through":"none", lineHeight:1.3 }}>
                        {ch.title}
                      </div>
                      {ch.content && (
                        <div style={{ fontSize:10, color:C.muted, marginTop:4, letterSpacing:"0.06em" }}>
                          {ch.content.split(/\s+/).filter(Boolean).length} words written
                        </div>
                      )}
                      {!ch.content && (
                        <div style={{ fontSize:10, color:C.muted, marginTop:4, fontStyle:"italic" }}>
                          tap to write notes
                        </div>
                      )}
                    </div>
                    <span style={{ color:ch.done?C.blue:C.muted, fontSize:20 }}>›</span>
                  </div>
                ))}
              </div>
            )}

            {/* Evidence + Burn row */}
            <div style={{ display:"flex", gap:8, marginTop:16 }}>
              <button onClick={()=>openSheet("evidence")}
                style={{ flex:1, background:"rgba(255,255,255,0.03)", border:`1px solid ${C.border}`, borderRadius:10, padding:"12px", color:C.greyLight, fontSize:10, letterSpacing:"0.12em", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}>
                📎 EVIDENCE {(story.evidence||[]).length>0?`(${story.evidence.length})`:""}
              </button>
              <button onClick={()=>{ if(window.confirm(`Burn "${story.title}"?`)){onDelete(story.id);onBack();} }}
                style={{ background:"rgba(204,51,51,0.08)", border:`1px solid ${C.red}44`, borderRadius:10, padding:"12px 16px", color:C.red, fontSize:10, letterSpacing:"0.12em", cursor:"pointer" }}>
                BURN
              </button>
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// MAIN APP
// ─────────────────────────────────────────────────────────────────────────────
function MainApp() {
  const [stories,   setStories]   = useState(()=>loadFromStorage(SK.stories, DEFAULTS));
  const [activeId,  setActiveId]  = useState(null);
  const [showNew,   setShowNew]   = useState(false);
  const [syncState, setSyncState] = useState("idle"); // "idle" | "syncing" | "synced" | "error"

  // Start nextId above the highest existing ID so new stories never collide
  const nextId = useRef(null);
  if (nextId.current === null) {
    const loaded = loadFromStorage(SK.stories, DEFAULTS);
    const maxId  = loaded.reduce((max, s) => Math.max(max, s.id || 0), 0);
    nextId.current = Math.max(maxId + 1, Date.now());
  }

  // On mount — try to load from cloud and merge with local
  useEffect(() => {
    setSyncState("syncing");
    loadFromCloud().then(cloudStories => {
      if (cloudStories && cloudStories.length > 0) {
        // Merge: cloud wins for newer stories, local wins for newer local
        setStories(local => {
          const merged = [...cloudStories];
          local.forEach(ls => {
            const cloudMatch = merged.find(cs => cs.id === ls.id);
            if (!cloudMatch) merged.push(ls);
            else if (new Date(ls.updatedAt) > new Date(cloudMatch.updatedAt)) {
              const idx = merged.findIndex(cs => cs.id === ls.id);
              merged[idx] = ls;
            }
          });
          saveToStorage(SK.stories, merged);
          return merged;
        });
        setSyncState("synced");
      } else {
        setSyncState("idle");
      }
    }).catch(()=>setSyncState("error"));
  }, []);

  useEffect(()=>{ saveToStorage(SK.stories, stories); }, [stories]);

  const addStory = d => {
    const id = nextId.current++;
    const newStory = { id, ...d };
    setStories(ss => {
      const updated = [newStory, ...ss];
      saveToStorage(SK.stories, updated);
      setSyncState("syncing");
      syncToCloud(updated).then(()=>setSyncState("synced")).catch(()=>setSyncState("error"));
      return updated;
    });
    if (!d.prefill) setActiveId(id);
  };

  const manualSync = () => {
    setSyncState("syncing");
    syncToCloud(stories)
      .then(ok => setSyncState(ok ? "synced" : "error"))
      .catch(() => setSyncState("error"));
  };

  const handleNew = (opts={}) => {
    if (opts.prefill && opts.title) {
      addStory({
        title:opts.title, genre:"THRILLER", status:"ACTIVE OP", logline:"",
        coverImage:null, coverFilter:"classified", content:"",
        sections:DEFAULT_SECTIONS.map(s=>({...s})),
        chapters:[], evidence:[], updatedAt:new Date().toISOString(),
      });
    } else {
      setShowNew(true);
    }
  };
  const updateStory = upd => setStories(ss => {
    const next = ss.map(s=>s.id===upd.id?upd:s);
    saveToStorage(SK.stories, next);
    setSyncState("syncing");
    syncToCloud(next).then(ok=>setSyncState(ok?"synced":"error")).catch(()=>setSyncState("error"));
    return next;
  });
  const deleteStory = id => {
    setStories(ss => {
      const next = ss.filter(s=>s.id!==id);
      saveToStorage(SK.stories, next);
      syncToCloud(next).then(ok=>setSyncState(ok?"synced":"error")).catch(()=>setSyncState("error"));
      return next;
    });
    setActiveId(null);
  };
  const activeStory = stories.find(s=>s.id===activeId);

  return (
    <>
      {showNew && <NewDossierSheet onSave={d=>{addStory(d);setShowNew(false);}} onClose={()=>setShowNew(false)}/>}
      {activeStory
        ? <DossierDetail story={activeStory} onChange={updateStory} onBack={()=>setActiveId(null)} onDelete={deleteStory}/>
        : <DossierList stories={stories} onOpen={id=>setActiveId(id)} onNew={handleNew} onDelete={deleteStory} syncState={syncState} onSync={manualSync}/>
      }
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ROOT
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [booted, setBooted] = useState(false);
  return (
    <>
      <style>{globalCSS}</style>
      {booted ? <MainApp/> : <BootSequence onComplete={()=>setBooted(true)}/>}
    </>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App)
    );
  </script>
</body>
