// Get or create a stable device ID so stories sync per device
function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) { id = "device_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(DEVICE_ID_KEY, id); }
  return id;
}

async function syncToCloud(stories) {
  try {
    const deviceId = getDeviceId();
    const payload  = { id: deviceId, user_id: deviceId, data: { stories }, updated_at: new Date().toISOString() };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stories`, {
      method: "POST",
      headers: {
        "Content-Type":  "application/json",
        "apikey":        SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer":        "resolution=merge-duplicates,return=minimal",
      },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.text();
      console.warn("Cloud sync error:", res.status, err);
      return false;
    }
    return true;
  } catch(e) {
    console.warn("Cloud sync failed:", e);
    return false;
  }
}

async function loadFromCloud() {
  try {
    const deviceId = getDeviceId();

        "apikey":        SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,

// ─────────────────────────────────────────────────────────────────────────────
// IMAGE COMPRESSION  (iPhone photos → ~200KB)
// ─────────────────────────────────────────────────────────────────────────────
function compressImage(file, maxWidth = 900, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload  = ({ target: { result } }) => {
      const img = new Image();
      img.onerror = reject;
      img.onload  = () => {
        const scale  = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = result;
    };
    reader.readAsDataURL(file);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso), diff = Date.now() - d;
  if (diff < 60000)     return "just now";
  if (diff < 3600000)   return `${Math.floor(diff / 60000)}m ago`;
  if (diff < 86400000)  return d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
  if (diff < 604800000) return d.toLocaleDateString("en-US", { weekday:"short" });
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric" });
}

function useTypewriter(lines, delay = 14, startDelay = 0) {
  const [displayed, setDisplayed] = useState([]);
  const [done,      setDone]      = useState(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      await sleep(startDelay);
      const out = [];
      for (const line of lines) {
        if (cancelled) return;
        out.push(""); setDisplayed([...out]);
        for (let c = 0; c < line.length; c++) {
          if (cancelled) return;
          out[out.length - 1] = line.slice(0, c + 1);
          setDisplayed([...out]);
          await sleep(delay);
        }
        await sleep(50);
      }
      if (!cancelled) setDone(true);
    })();
    return () => { cancelled = true; };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  return { displayed, done };
}

const DEFAULT_SECTIONS = [
  { id:"s1", title:"KEY THEMES",    content:"" },
  { id:"s3", title:"CHARACTERS",    content:"" },
  { id:"s4", title:"RESEARCH",      content:"" },
  { id:"s5", title:"PLOT NOTES",    content:"" },
];

// ─────────────────────────────────────────────────────────────────────────────
// NEW DOSSIER SHEET
// ─────────────────────────────────────────────────────────────────────────────
function NewDossierSheet({ onSave, onClose }) {
  const [title,   setTitle]   = useState("");
  const [genre,   setGenre]   = useState("THRILLER");
  const [status,  setStatus]  = useState("ACTIVE OP");
  const [logline, setLogline] = useState("");

  const handleSave = () => {
    if (!title.trim()) return;
    onSave({ title:title.trim(), genre, status, logline, coverImage:null, coverFilter:"classified", content:"", sections:DEFAULT_SECTIONS.map(s=>({...s})), chapters:[], evidence:[], updatedAt:new Date().toISOString() });
    onClose();
  };

  return (
    <BottomSheet title="NEW DOSSIER" onClose={onClose}>
      <div style={{ display:"flex", flexDirection:"column", gap:18 }}>
        <div>
          <FieldLabel>TITLE</FieldLabel>
          <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Give your story a name..." autoFocus
            onKeyDown={e=>e.key==="Enter"&&handleSave()}
            style={{ width:"100%", background:"rgba(255,255,255,0.05)", border:`1px solid ${C.border}`, borderRadius:8, padding:"12px 14px", color:C.white, fontFamily:"'Special Elite',serif", fontSize:18, outline:"none" }}/>
        </div>
        <div>
          <FieldLabel>ONE LINE SUMMARY (optional)</FieldLabel>
          <input value={logline} onChange={e=>setLogline(e.target.value)} placeholder="What is this story about?"
            style={{ width:"100%", background:"rgba(255,255,255,0.04)", border:`1px solid ${C.border}`, borderRadius:8, padding:"11px 14px", color:C.greyLight, fontSize:12, outline:"none" }}/>
        </div>
        <div>
          <FieldLabel>STATUS</FieldLabel>
          <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginTop:4 }}>
            {STATUSES.map(s=><PillBtn key={s} active={status===s} onClick={()=>setStatus(s)} color={STATUS_COLORS[s]}>{s}</PillBtn>)}
          </div>
        </div>
        <div>
          <FieldLabel>GENRE</FieldLabel>
          <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginTop:4, maxHeight:120, overflowY:"auto" }}>
            {GENRES.map(g=><PillBtn key={g} active={genre===g} onClick={()=>setGenre(g)}>{g}</PillBtn>)}
          </div>
        </div>
        <button onClick={handleSave}
          style={{ width:"100%", background:C.blue, border:"none", borderRadius:10, padding:"14px", color:C.bg, fontFamily:"'Rajdhani',sans-serif", fontSize:14, fontWeight:700, letterSpacing:"0.2em", cursor:"pointer", marginTop:4 }}>
          CREATE DOSSIER
        </button>
      </div>
    </BottomSheet>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// DOSSIER LIST
// ─────────────────────────────────────────────────────────────────────────────
function DossierList({ stories, onOpen, onNew, onDelete, syncState, onSync }) {
  const [search,       setSearch]       = useState("");
  const [filterStatus, setFilterStatus] = useState("ALL");
  const [quickCapture, setQuickCapture] = useState(false);
  const [captureText,  setCaptureText]  = useState("");
  const captureRef = useRef(null);

  const filtered = stories.filter(s => {
    const matchText   = (s.title+(s.logline||"")).toLowerCase().includes(search.toLowerCase());
    const matchStatus = filterStatus==="ALL" || s.status===filterStatus;
    return matchText && matchStatus;
  });

  const exportAll = () => {
    const lines = stories.map(s => {
      const secText = (s.sections||[]).map(sec=>`\n## ${sec.title}\n${sec.content||"(empty)"}`).join("\n");
      const chapText = (s.chapters||[]).map(ch=>`\n### ${ch.title}${ch.done?" ✓":""}\n${(ch.blocks||[]).map(b=>b.text).join("\n")||ch.content||"(empty)"}`).join("\n");
      return `# ${s.title}\n${s.status} · ${s.genre}${s.logline?"\n"+s.logline:""}${secText}${chapText}`;
    }).join("\n\n---\n\n");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(lines).then(()=>alert("All dossiers copied to clipboard!"));
    }
  };

  return (
    <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", background:C.bg }}>

      {/* Header */}
      <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"14px 18px 12px", paddingTop:"max(14px,env(safe-area-inset-top,14px))" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
          <EDLogo size={28} color={C.silver} glow/>
          <div>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:16, fontWeight:700, letterSpacing:"0.35em", color:C.amber }}>OPERATION CODEX</div>
            <div style={{ fontSize:8, color:C.grey, letterSpacing:"0.2em", marginTop:1 }}>STORY ARCHIVE</div>
          </div>
          <div style={{ flex:1 }}/>
          {/* Sync status dot — tap to force sync */}
          <div onClick={onSync} style={{ display:"flex", alignItems:"center", gap:4, marginRight:6, cursor:"pointer", padding:"4px 6px" }}>
            <div style={{ width:7, height:7, borderRadius:"50%", background: syncState==="synced"?C.green:syncState==="syncing"?C.amber:syncState==="error"?C.red:C.muted, transition:"background 0.4s", boxShadow: syncState==="synced"?`0 0 6px ${C.green}`:syncState==="syncing"?`0 0 6px ${C.amber}`:"none" }}/>
            <span style={{ fontSize:7, color:C.muted, letterSpacing:"0.1em", fontFamily:"'Rajdhani',sans-serif" }}>
              {syncState==="synced"?"SYNCED":syncState==="syncing"?"SYNCING...":syncState==="error"?"OFFLINE — TAP":"LOCAL — TAP"}
            </span>
          </div>
          <button onClick={exportAll}
            style={{ background:"transparent", border:`1px solid ${C.border}`, borderRadius:8, width:34, height:34, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", color:C.greyLight, fontSize:14, flexShrink:0 }}>
            ↑
          </button>
          <button onClick={()=>{ setQuickCapture(v=>!v); setTimeout(()=>captureRef.current && captureRef.current.focus(),80); }}
            style={{ background:quickCapture?C.amber:C.blue, border:"none", borderRadius:10, width:38, height:38, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", fontSize:22, color:C.bg, lineHeight:1, flexShrink:0 }}>
            {quickCapture?"×":"+"}
          </button>
        </div>

        {/* Quick capture */}
        {quickCapture && (
          <div style={{ display:"flex", gap:8, marginBottom:10, animation:"fadeUp 0.15s ease both" }}>
            <input ref={captureRef} value={captureText} onChange={e=>setCaptureText(e.target.value)}
              onKeyDown={e=>{ if(e.key==="Enter"&&captureText.trim()){ onNew({ title:captureText.trim(), prefill:true }); setCaptureText(""); setQuickCapture(false); } }}
              placeholder="Quick idea... press Enter to save"
              style={{ flex:1, background:"rgba(255,255,255,0.06)", border:`1px solid ${C.amber}`, borderRadius:8, padding:"10px 13px", color:C.white, fontSize:14, outline:"none", fontFamily:"'Special Elite',serif" }}/>
            <button onClick={()=>{ if(captureText.trim()){ onNew({ title:captureText.trim(), prefill:true }); setCaptureText(""); setQuickCapture(false); } }}
              style={{ background:C.amber, border:"none", borderRadius:8, padding:"10px 14px", color:C.bg, fontSize:16, fontWeight:700, cursor:"pointer" }}>→</button>
          </div>
        )}
        <div style={{ position:"relative", marginBottom:10 }}>
          <span style={{ position:"absolute", left:11, top:"50%", transform:"translateY(-50%)", fontSize:13, color:C.muted, pointerEvents:"none" }}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search dossiers..."
            style={{ width:"100%", background:"rgba(255,255,255,0.05)", border:`1px solid ${C.border}`, borderRadius:8, padding:"9px 10px 9px 32px", color:C.white, fontSize:12, outline:"none" }}/>
        </div>
        <div style={{ display:"flex", gap:6, overflowX:"auto", paddingBottom:2 }}>
          {["ALL",...STATUSES].map(s=>(
            <PillBtn key={s} active={filterStatus===s} onClick={()=>setFilterStatus(s)} color={STATUS_COLORS[s]||C.blue}>{s}</PillBtn>
          ))}
        </div>
      </div>

      {/* Stats */}
      <div style={{ display:"flex", background:C.panel, borderBottom:`1px solid ${C.border}` }}>
        {[
          { label:"DOSSIERS", val:stories.length,                                       color:C.white },
          { label:"ACTIVE",   val:stories.filter(s=>s.status==="ACTIVE OP").length,     color:C.blue  },
          { label:"COMPLETE", val:stories.filter(s=>s.status==="COMPLETE").length,      color:C.green },
        ].map((s,i)=>(
          <div key={i} style={{ flex:1, padding:"8px 0", textAlign:"center", borderRight:i<2?`1px solid ${C.border}`:"none" }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:22, fontWeight:700, color:s.color, lineHeight:1 }}>{s.val}</div>
            <div style={{ fontSize:7, color:C.muted, letterSpacing:"0.15em", marginTop:3 }}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* List */}
      <div style={{ flex:1, minHeight:0, overflowY:"auto", WebkitOverflowScrolling:"touch" }}>
        {filtered.length===0 && (
          <p style={{ padding:40, textAlign:"center", color:C.muted, fontSize:13, fontStyle:"italic" }}>
            {search ? "No dossiers match your search." : "No dossiers yet. Tap + to create one."}
          </p>
        )}
        {filtered.map((s,idx) => {
          const statusColor = STATUS_COLORS[s.status]||C.grey;
          const chapDone    = s.chapters && s.chapters.filter(c=>c.done).length||0;
          const chapTotal   = s.chapters && s.chapters.length||0;
          const wordCount   = (s.content||"").split(/\s+/).filter(Boolean).length;
          const filterCSS   = (PHOTO_FILTERS.find(f=>f.id===s.coverFilter) || PHOTO_FILTERS[0]).css;
          return (
            <div key={s.id} onClick={()=>onOpen(s.id)}
              style={{ borderBottom:`1px solid ${C.border}`, cursor:"pointer", animation:`fadeUp 0.2s ease ${idx*0.04}s both`, overflow:"hidden" }}>
              {s.coverImage && (
                <div style={{ position:"relative", height:150, overflow:"hidden" }}>
                  <img src={s.coverImage} alt="Cover" style={{ width:"100%", height:"100%", objectFit:"cover", filter:filterCSS, display:"block" }}/>
                  {s.coverFilter==="surveillance" && <ScanlineOverlay/>}
                  <PhotoStamp filter={s.coverFilter}/>
                  <div style={{ position:"absolute", bottom:0, left:0, right:0, height:50, background:"linear-gradient(transparent,rgba(7,9,11,0.95))" }}/>
                </div>
              )}
              <div style={{ padding:"12px 18px", display:"flex", alignItems:"flex-start", gap:10 }}>
                <div style={{ width:3, alignSelf:"stretch", background:statusColor, borderRadius:2, flexShrink:0, opacity:0.75, marginTop:3 }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", gap:8 }}>
                    <span style={{ fontFamily:"'Special Elite',serif", fontSize:17, color:C.white, lineHeight:1.3, flex:1 }}>{s.title}</span>
                    <span style={{ fontSize:9, color:C.muted, flexShrink:0, marginTop:2 }}>{formatDate(s.updatedAt)}</span>
                  </div>
                  {s.logline && (
                    <p style={{ fontSize:11, color:C.muted, marginTop:4, lineHeight:1.45, fontStyle:"italic", overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", margin:"4px 0 0" }}>
                      "{s.logline}"
                    </p>
                  )}
                  <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:7, flexWrap:"wrap" }}>
                    {!s.coverImage && <span style={{ fontSize:8, color:statusColor, letterSpacing:"0.12em", fontFamily:"'Rajdhani',sans-serif", fontWeight:600 }}>{s.status}</span>}
                    <span style={{ fontSize:8, color:C.muted }}>·</span>
                    <span style={{ fontSize:8, color:C.muted }}>{s.genre}</span>
                    {wordCount>0 && <><span style={{ fontSize:8, color:C.muted }}>·</span><span style={{ fontSize:8, color:C.muted }}>{wordCount}w</span></>}
                    {(s.evidence||[]).length>0 && <><span style={{ fontSize:8, color:C.muted }}>·</span><span style={{ fontSize:8, color:C.amber }}>📎 {s.evidence.length}</span></>}
                  </div>
                  {chapTotal>0 && (
                    <div style={{ height:2, background:C.blueFaint, borderRadius:1, overflow:"hidden", marginTop:8 }}>
                      <div style={{ height:"100%", width:`${(chapDone/chapTotal)*100}%`, background:`linear-gradient(90deg,${C.blueDim},${C.blue})` }}/>
                    </div>
                  )}
                </div>
                <span style={{ color:C.muted, fontSize:18, alignSelf:"center", flexShrink:0 }}>›</span>
              </div>
            </div>
          );
        })}
      </div>

      {/* Footer */}
      <div style={{ background:C.panel, borderTop:`1px solid ${C.border}`, padding:"5px 16px", paddingBottom:"max(5px,env(safe-area-inset-bottom,5px))", display:"flex", justifyContent:"space-between", fontSize:7, color:C.muted, letterSpacing:"0.1em" }}>
        <span>OPERATION CODEX // FOR THE CONTINUITY. FOR THE MISSION.</span>
        <span style={{ animation:"blink 3s infinite", color:C.blueDim }}>● SECURE</span>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CHAPTERS PANEL (bottom sheet inside dossier)
// ─────────────────────────────────────────────────────────────────────────────
function ChaptersSheet({ story, onUpdate, onClose }) {
  const [adding,    setAdding]    = useState(false);
  const [newTitle,  setNewTitle]  = useState("");
  const [activeChapter, setActiveChapter] = useState(null);
  const chapCounter = useRef(Date.now());

  const chapDone  = story.chapters && story.chapters.filter(c=>c.done).length||0;
  const chapTotal = story.chapters && story.chapters.length||0;

  const addChapter = () => {
    if (!newTitle.trim()) return;
    onUpdate({ chapters:[...(story.chapters||[]), { id:chapCounter.current++, title:newTitle.trim(), done:false, content:"" }] });
    setNewTitle(""); setAdding(false);
  };
  const toggleChapter = id => onUpdate({ chapters:story.chapters.map(c=>c.id===id?{...c,done:!c.done}:c) });
  const deleteChapter = id => onUpdate({ chapters:story.chapters.filter(c=>c.id!==id) });
  const saveChapter   = updated => { onUpdate({ chapters:story.chapters.map(c=>c.id===updated.id?updated:c) }); setActiveChapter(null); };

  if (activeChapter) {
    return (
      <div style={{ position:"absolute", inset:0, background:C.bg, zIndex:300, display:"flex", flexDirection:"column", animation:"fadeIn 0.2s ease both" }}>
        <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"12px 18px", paddingTop:"max(12px,env(safe-area-inset-top,12px))", display:"flex", alignItems:"center", gap:12, flexShrink:0 }}>
          <button onClick={()=>{ saveChapter(activeChapter); }}
            style={{ background:"transparent", border:"none", color:C.blue, fontSize:13, cursor:"pointer", letterSpacing:"0.1em", padding:0, flexShrink:0 }}>
            ‹ BACK
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontFamily:"'Special Elite',serif", fontSize:14, color:C.white, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{activeChapter.title}</div>
            <div style={{ fontSize:8, color:C.muted, letterSpacing:"0.1em", marginTop:2 }}>{activeChapter.done ? "✓ COMPLETE" : "IN PROGRESS"}</div>
          </div>
          <button onClick={()=>{ const updated={...activeChapter,done:!activeChapter.done}; setActiveChapter(updated); onUpdate({ chapters:story.chapters.map(c=>c.id===updated.id?updated:c) }); }}
            style={{ background:activeChapter.done?"rgba(80,170,96,0.15)":"transparent", border:`1px solid ${activeChapter.done?C.green:C.border}`, borderRadius:8, padding:"5px 10px", color:activeChapter.done?C.green:C.grey, fontSize:9, letterSpacing:"0.12em", cursor:"pointer", flexShrink:0 }}>
            {activeChapter.done ? "✓ DONE" : "MARK DONE"}
          </button>
        </div>
        <textarea
          value={activeChapter.content||""}
          onChange={e=>setActiveChapter({...activeChapter,content:e.target.value})}
          autoFocus
          placeholder={`Write notes for "${activeChapter.title}" here...\n\nScene ideas, dialogue, character beats, research — anything that belongs in this chapter.`}
          style={{ flex:1, width:"100%", background:"transparent", border:"none", resize:"none", color:C.white, fontFamily:"'Special Elite',serif", fontSize:16, lineHeight:1.95, padding:"22px 22px", outline:"none", overflowY:"scroll", WebkitOverflowScrolling:"touch", paddingBottom:"max(30px,env(safe-area-inset-bottom,30px))" }}
        />
        <div style={{ background:C.panel, borderTop:`1px solid ${C.border}`, padding:"6px 18px", paddingBottom:"max(6px,env(safe-area-inset-bottom,6px))", fontSize:9, color:C.muted, textAlign:"right", letterSpacing:"0.1em", flexShrink:0 }}>
          {(activeChapter.content||"").split(/\s+/).filter(Boolean).length} words
        </div>
      </div>
    );
  }

  return (
    <BottomSheet title="CHAPTERS" onClose={onClose}>
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {chapTotal>0 && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:9, color:C.grey, letterSpacing:"0.12em", marginBottom:6 }}>
              <span>PROGRESS</span><span>{chapDone}/{chapTotal} COMPLETE</span>
            </div>
            <div style={{ height:3, background:C.blueFaint, borderRadius:2, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${chapTotal?(chapDone/chapTotal)*100:0}%`, background:`linear-gradient(90deg,${C.blueDim},${C.blue})`, transition:"width 0.3s" }}/>
            </div>
          </div>
        )}

        <button onClick={()=>setAdding(v=>!v)}
          style={{ background:adding?C.blueFaint:"transparent", border:`1px solid ${adding?C.blue:C.border}`, borderRadius:8, padding:"9px 14px", color:adding?C.blue:C.grey, fontSize:10, letterSpacing:"0.15em", cursor:"pointer" }}>
          {adding ? "CANCEL" : "+ ADD CHAPTER"}
        </button>

        {adding && (
          <div style={{ display:"flex", gap:7, animation:"fadeUp 0.15s ease both" }}>
            <input value={newTitle} onChange={e=>setNewTitle(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&addChapter()} placeholder="Chapter title..." autoFocus
              style={{ flex:1, background:"rgba(255,255,255,0.05)", border:`1px solid ${C.blue}`, borderRadius:8, padding:"10px 13px", color:C.white, fontSize:13, outline:"none" }}/>
            <button onClick={addChapter}
              style={{ background:C.blue, border:"none", borderRadius:8, padding:"10px 16px", color:C.bg, fontSize:18, fontWeight:700, cursor:"pointer" }}>+</button>
          </div>
        )}

        {(story.chapters||[]).length===0 && !adding && (
          <p style={{ fontSize:11, color:C.muted, fontStyle:"italic", textAlign:"center", padding:"10px 0" }}>No chapters yet. Tap + Add Chapter to create one.</p>
        )}

        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {(story.chapters||[]).map(ch=>(
            <div key={ch.id} style={{ background:ch.done?"rgba(79,195,247,0.05)":"rgba(255,255,255,0.03)", border:`1px solid ${ch.done?C.blueDim:C.border}`, borderRadius:10, overflow:"hidden" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, padding:"12px 14px" }}>
                <div onClick={()=>toggleChapter(ch.id)}
                  style={{ width:18, height:18, border:`2px solid ${ch.done?C.blue:C.muted}`, borderRadius:4, background:ch.done?C.blue:"transparent", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, cursor:"pointer", transition:"all 0.12s" }}>
                  {ch.done && <span style={{ color:C.bg, fontSize:10, fontWeight:900 }}>✓</span>}
                </div>
                <div onClick={()=>setActiveChapter({
                    ...ch,
                    // Always ensure blocks array exists for ScreenplayWriter
                    blocks: ch.blocks && ch.blocks.length>0
                      ? ch.blocks
                      : ch.content
                        ? [{ id:Date.now(), type:"action", text:ch.content }]
                        : [{ id:Date.now(), type:"scene",  text:"" }],
                  })} style={{ flex:1, cursor:"pointer" }}>
                  <div style={{ fontSize:13, color:ch.done?C.greyLight:C.white, textDecoration:ch.done?"line-through":"none" }}>{ch.title}</div>
                  <div style={{ fontSize:9, color:C.muted, marginTop:3, letterSpacing:"0.06em", fontStyle:((ch.blocks&&ch.blocks.length>0)||ch.content?"normal":"italic") }}>
                    {(ch.blocks&&ch.blocks.length>0)
                      ? `${ch.blocks.reduce((a,b)=>a+b.text.split(/\s+/).filter(Boolean).length,0)} words · tap to write screenplay`
                      : ch.content
                        ? `${ch.content.split(/\s+/).filter(Boolean).length} words · tap to edit`
                        : "tap to write screenplay"}
                  </div>
                </div>
                <span onClick={()=>setActiveChapter({...ch})} style={{ color:C.blue, fontSize:16, cursor:"pointer", flexShrink:0 }}>›</span>
                <button onClick={()=>deleteChapter(ch.id)}
                  style={{ background:"transparent", border:"none", color:C.muted, cursor:"pointer", fontSize:18, lineHeight:1, padding:"0 0 0 4px" }}>×</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </BottomSheet>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// EVIDENCE PANEL (bottom sheet inside dossier)
// ─────────────────────────────────────────────────────────────────────────────
function EvidenceSheet({ story, onUpdate, onClose }) {
  const [filterPicker, setFilterPicker] = useState(null);
  const [lightbox,     setLightbox]     = useState(null);
  const [uploading,    setUploading]    = useState(false);
  const fileInputRef = useRef(null);
  const evidCounter  = useRef(Date.now()+9000);

  const handleFile = async (file) => {
    if (!file) return;
    setUploading(true);
    try {
      const compressed = await compressImage(file);
      setFilterPicker({ src:compressed });
    } catch (e) { console.error(e); }
    finally { setUploading(false); }
  };

  const handleFilterConfirm = (filter) => {
    const ev = { id:evidCounter.current++, src:filterPicker.src, filter, caption:"", addedAt:new Date().toISOString() };
    onUpdate({ evidence:[...(story.evidence||[]), ev] });
    setFilterPicker(null);
  };

  const updateCaption  = (id,cap) => onUpdate({ evidence:story.evidence.map(e=>e.id===id?{...e,caption:cap}:e) });
  const deleteEvidence = (id)     => { onUpdate({ evidence:story.evidence.filter(e=>e.id!==id) }); setLightbox(null); };

  return (
    <>
      <input ref={fileInputRef} type="file" accept="image/*" onChange={e=>{handleFile(e.target.files[0]);e.target.value="";}} style={{ display:"none" }}/>
      {filterPicker && <FilterPickerSheet src={filterPicker.src} onConfirm={handleFilterConfirm} onClose={()=>setFilterPicker(null)}/>}
      {uploading && (
        <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.7)", zIndex:500, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <span style={{ color:C.blue, fontFamily:"'Rajdhani',sans-serif", fontSize:14, letterSpacing:"0.3em", animation:"blink 1s infinite" }}>PROCESSING...</span>
        </div>
      )}

      {lightbox && (
        <div style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.97)", zIndex:400, display:"flex", flexDirection:"column", animation:"fadeIn 0.15s ease both" }}>
          <div style={{ padding:"16px 18px", paddingTop:"max(16px,env(safe-area-inset-top,16px))", display:"flex", justifyContent:"flex-end" }}>

// ─────────────────────────────────────────────────────────────────────────────
// SCREENPLAY WRITER — with autocomplete, shot types, and split notes tab
// ─────────────────────────────────────────────────────────────────────────────
const SP_TYPES = [
  { id:"scene",        label:"SCENE",      hint:"INT. LOCATION - DAY",         color:C.amber,     upper:true,  align:"left",   ml:"0%",  mr:"0%"  },
  { id:"action",       label:"ACTION",     hint:"Character enters the room...", color:C.white,     upper:false, align:"left",   ml:"0%",  mr:"0%"  },
  { id:"character",    label:"CHARACTER",  hint:"CHARACTER NAME",               color:C.blue,      upper:true,  align:"center", ml:"30%", mr:"10%" },
  { id:"dialogue",     label:"DIALOGUE",   hint:"What the character says...",   color:C.greyLight, upper:false, align:"left",   ml:"20%", mr:"20%" },
  { id:"parenthetical",label:"PAREN",      hint:"(beat)",                       color:C.green,     upper:false, align:"left",   ml:"25%", mr:"35%" },
  { id:"transition",   label:"TRANSITION", hint:"CUT TO:",                      color:C.amber,     upper:true,  align:"right",  ml:"40%", mr:"0%"  },
  { id:"shot",         label:"SHOT",       hint:"ECU — CHARACTER",              color:"#9b59b6",   upper:true,  align:"left",   ml:"0%",  mr:"0%"  },
];

// Autocomplete suggestions
const SCENE_PREFIXES  = ["INT.", "EXT.", "INT./EXT.", "I/E."];
const TIME_OF_DAY     = ["DAY", "NIGHT", "DAWN", "DUSK", "CONTINUOUS", "LATER", "MOMENTS LATER"];
const SHOT_TYPES      = [
  "ECU —","CU —","MCU —","MS —","WS —",
  "OTS —","POV —","AERIAL —","INSERT —",
];
const TRANSITIONS     = [
  "CUT TO:","SMASH CUT TO:","MATCH CUT TO:",
  "FADE IN:","FADE OUT.","FADE TO BLACK.","DISSOLVE TO:",
];

function buildSuggestions(type, text) {
  const t = text.toUpperCase().trim();
  if (type === "scene") {
    // Empty scene — offer prefixes
    if (!t) return SCENE_PREFIXES.map(p=>({ label:p, insert:p+" " }));
    // After prefix — offer time of day
    const prefixMatch = SCENE_PREFIXES.find(p=>t.startsWith(p));
    if (prefixMatch && t.includes(" - ")) {
      return TIME_OF_DAY
        .filter(tod=>tod.startsWith(t.split(" - ").pop()))
        .map(tod=>({ label:tod, insert: text.replace(/[A-Z]*$/, "") + tod }));
    }
    // Partial prefix
    return SCENE_PREFIXES
      .filter(p=>p.startsWith(t)&&p!==t)
      .map(p=>({ label:p, insert:p+" " }));
  }
  if (type === "shot") {
    if (!t) return SHOT_TYPES.map(s=>({ label:s, insert:s+" " }));
    return SHOT_TYPES
      .filter(s=>s.startsWith(t)&&s.trim()!==t)
      .map(s=>({ label:s, insert:s+" " }));
  }
  if (type === "transition") {
    if (!t) return TRANSITIONS.map(tr=>({ label:tr, insert:tr }));
    return TRANSITIONS
      .filter(tr=>tr.startsWith(t)&&tr!==t)
      .map(tr=>({ label:tr, insert:tr }));
  }
  return [];
}

function ScreenplayWriter({ chapter, onSave }) {
  const initBlocks = () => {
    if (chapter.blocks && chapter.blocks.length > 0) return chapter.blocks;
    if (chapter.content) return [{ id:Date.now(), type:"action", text:chapter.content }];
    return [{ id:Date.now(), type:"scene", text:"" }];
  };

  const [tab,           setTab]           = useState("screenplay");
  const [blocks,        setBlocks]        = useState(initBlocks);
  const [notes,         setNotes]         = useState(chapter.notes||"");
  const [activeBlock,   setActiveBlock]   = useState(0);
  const [suggestions,   setSuggestions]   = useState([]);
  const [showToolbar,   setShowToolbar]   = useState(true);
  const [showQuickInsert, setShowQuickInsert] = useState(false);
  const textRefs   = useRef({});
  const blockIdRef = useRef(Date.now() + 9999);
  const toolbarTimer = useRef(null);

  const wordCount  = blocks.reduce((acc,b)=>acc+b.text.split(/\s+/).filter(Boolean).length,0);
  const notesWords = notes.split(/\s+/).filter(Boolean).length;
  const isEmpty    = wordCount === 0;

  const resetTimer = () => {
    setShowToolbar(true);
    clearTimeout(toolbarTimer.current);
    // Never auto-hide on empty chapters — always keep toolbar visible
    if (!isEmpty) {
      toolbarTimer.current = setTimeout(()=>setShowToolbar(false), 8000);
    }
  };
  useEffect(()=>{
    // Always show toolbar on mount
    setShowToolbar(true);
    return ()=>clearTimeout(toolbarTimer.current);
  },[]);

  const handleSave = () => {
    const plainText = blocks.map(b=>b.text).join("\n");
    onSave({ ...chapter, blocks, content:plainText, notes });
  };

  const updateBlock = (idx, text) => {
    setBlocks(bs=>bs.map((b,i)=>i===idx?{...b,text}:b));
    const type = blocks[idx] && blocks[idx].type;
    if (type==="character") {
      // Show matching character names as you type
      const upper = text.toUpperCase();
      const matches = knownCharacters.filter(c=>c.startsWith(upper)&&c!==upper);
      setSuggestions(matches.map(c=>({ label:c, insert:c })));
    } else if (["scene","shot","transition"].includes(type)) {
      setSuggestions(buildSuggestions(type, text));
    } else {
      setSuggestions([]);
    }
  };

  const applySuggestion = (sug, idx) => {
    setBlocks(bs=>bs.map((b,i)=>i===idx?{...b,text:sug.insert}:b));
    setSuggestions([]);
    setTimeout(()=>textRefs.current[idx] && textRefs.current[idx].focus(),30);
  };

  const setType = (type) => {
    setBlocks(bs=>bs.map((b,i)=>i===activeBlock?{...b,type}:b));
    setSuggestions(buildSuggestions(type, blocks[activeBlock] && blocks[activeBlock].text||""));
    setTimeout(()=>textRefs.current[activeBlock] && textRefs.current[activeBlock].focus(),50);
  };

  // Export blocks as WriterDuet-compatible plain text
  const exportForWriterDuet = () => {
    const lines = blocks.map(b => {
      const text = b.text.trim();
      if (!text) return "";
      switch(b.type) {
        case "scene":         return text.toUpperCase();
        case "action":        return text;
        case "character":     return "                    " + text.toUpperCase();
        case "parenthetical": return "                " + (text.startsWith("(") ? text : `(${text})`);
        case "dialogue":      return "          " + text;
        case "transition":    return "                                        " + text.toUpperCase();
        case "shot":          return text.toUpperCase();
        default:              return text;
      }
    }).filter(l => l !== null);

    const formatted = lines.join("\n\n");
    if (navigator.clipboard) {
      navigator.clipboard.writeText(formatted).then(()=>{
        setCopied(true);
        setTimeout(()=>setCopied(false), 2000);
      });
    }
  };

  const [copied, setCopied] = useState(false);
  const knownCharacters = [...new Set(
    blocks
      .filter(b=>b.type==="character" && b.text.trim())
      .map(b=>b.text.trim().toUpperCase())
  )];

  const handleKeyDown = (e, idx) => {
    resetTimer();

    // Tab — jump to character block (from action or dialogue)
    if (e.key==="Tab") {
      e.preventDefault();
      const cur = blocks[idx];
      if (cur.type==="action" || cur.type==="dialogue" || cur.type==="shot" || cur.type==="transition") {
        // Insert a character block right after
        const newBlock = { id:blockIdRef.current++, type:"character", text:"" };
        const insertAt = idx+1;
        setBlocks(bs=>[...bs.slice(0,insertAt), newBlock, ...bs.slice(insertAt)]);
        setActiveBlock(insertAt);
        setSuggestions(knownCharacters.map(c=>({ label:c, insert:c })));
        setTimeout(()=>textRefs.current[insertAt] && textRefs.current[insertAt].focus(),30);
      } else if (cur.type==="character") {
        // Tab on existing character — show known characters
        setSuggestions(knownCharacters.filter(c=>c!==cur.text.toUpperCase()).map(c=>({ label:c, insert:c })));
      }
      return;
    }

    // Tab through suggestions
    if (e.key==="Enter" && suggestions.length>0 && blocks[idx].type==="character") {
      e.preventDefault();
      applySuggestion(suggestions[0], idx);
      return;
    }

    if (e.key==="Enter") {
      e.preventDefault();
      setSuggestions([]);
      const cur = blocks[idx];
      const nextType = cur.type==="character"?"dialogue"
                     : cur.type==="parenthetical"?"dialogue"
                     : cur.type==="shot"?"action"
                     : "action";
      const newBlock = { id:blockIdRef.current++, type:nextType, text:"" };
      setBlocks(bs=>[...bs.slice(0,idx+1), newBlock, ...bs.slice(idx+1)]);
      setActiveBlock(idx+1);
      setTimeout(()=>{ const el=textRefs.current[idx+1]; if(el) el.focus(); },30);
    }
    if (e.key==="Backspace" && blocks[idx].text==="" && blocks.length>1) {
      e.preventDefault();
      setSuggestions([]);
      setBlocks(bs=>bs.filter((_,i)=>i!==idx));
      const prev = Math.max(0,idx-1);
      setActiveBlock(prev);
      setTimeout(()=>textRefs.current[prev] && textRefs.current[prev].focus(),30);
    }
  };

  const addBlock = (type, text="") => {
    const newBlock = { id:blockIdRef.current++, type, text };
    const insertAt = activeBlock+1;
    setBlocks(bs=>[...bs.slice(0,insertAt), newBlock, ...bs.slice(insertAt)]);
    setActiveBlock(insertAt);
    setSuggestions(buildSuggestions(type,""));
    setTimeout(()=>textRefs.current[insertAt] && textRefs.current[insertAt].focus(),50);
  };

  const activeType = SP_TYPES.find(t=>t.id===blocks[activeBlock] && blocks[activeBlock].type)||SP_TYPES[0];

  return (
    <div style={{ position:"absolute", inset:0, background:"#09100a", zIndex:300, display:"flex", flexDirection:"column", animation:"fadeIn 0.18s ease both" }}>

      {/* Header */}
      <div style={{ background:C.panel, borderBottom:`1px solid ${C.border}`, padding:"10px 16px", paddingTop:"max(10px,env(safe-area-inset-top,10px))", display:"flex", alignItems:"center", gap:10, flexShrink:0 }}>
        <button onClick={handleSave} style={{ background:"transparent", border:"none", color:C.blue, fontSize:13, cursor:"pointer", letterSpacing:"0.1em", padding:0, flexShrink:0 }}>‹ BACK</button>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontFamily:"'Special Elite',serif", fontSize:13, color:C.white, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{chapter.title}</div>
          <div style={{ fontSize:8, color:C.muted, letterSpacing:"0.1em", marginTop:1 }}>
            {tab==="screenplay" ? `${wordCount}w · ${blocks.length} blocks` : `${notesWords}w notes`}
          </div>
        </div>
        {/* WriterDuet export button — only on screenplay tab */}
        {tab==="screenplay" && (
          <button onClick={exportForWriterDuet}
            style={{ background:copied?"rgba(80,170,96,0.2)":"rgba(79,195,247,0.08)", border:`1px solid ${copied?C.green:C.border}`, borderRadius:7, padding:"4px 9px", color:copied?C.green:C.greyLight, fontSize:8, letterSpacing:"0.1em", cursor:"pointer", flexShrink:0, fontFamily:"'Rajdhani',sans-serif", fontWeight:700, transition:"all 0.2s", marginRight:4 }}>
            {copied ? "✓ COPIED" : "EXPORT"}
          </button>
        )}
        <button onClick={()=>onSave({...chapter,blocks,content:blocks.map(b=>b.text).join("\n"),notes,done:!chapter.done})}
          style={{ background:chapter.done?"rgba(80,170,96,0.15)":"transparent", border:`1px solid ${chapter.done?C.green:C.border}`, borderRadius:8, padding:"4px 9px", color:chapter.done?C.green:C.grey, fontSize:9, letterSpacing:"0.1em", cursor:"pointer", flexShrink:0 }}>
          {chapter.done?"✓ DONE":"MARK DONE"}
        </button>
      </div>

      {/* Tab switcher */}
      <div style={{ display:"flex", background:C.panel, borderBottom:`1px solid ${C.border}`, flexShrink:0 }}>
        {[{id:"screenplay",label:"SCREENPLAY"},{id:"notes",label:"CHAPTER NOTES"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{ flex:1, padding:"9px 0", background:"transparent", border:"none", borderBottom:`2px solid ${tab===t.id?C.blue:"transparent"}`, color:tab===t.id?C.blue:C.grey, fontSize:10, letterSpacing:"0.15em", cursor:"pointer", fontFamily:"'Rajdhani',sans-serif", fontWeight:700, transition:"all 0.15s" }}>
            {t.label}
          </button>
        ))}
      </div>

      {/* ── SCREENPLAY TAB ── */}
      {tab==="screenplay" && (
        <>
          <div style={{ flex:1, minHeight:0, overflowY:"scroll", WebkitOverflowScrolling:"touch", background:"#09100a", padding:"20px 16px 140px" }} onClick={resetTimer}>
            {/* Page title */}
            <div style={{ textAlign:"center", fontFamily:"'Share Tech Mono',monospace", fontSize:11, color:C.muted, letterSpacing:"0.2em", marginBottom:24, paddingBottom:14, borderBottom:`1px solid ${C.border}` }}>
              {chapter.title.toUpperCase()}
            </div>

            {blocks.map((block,idx)=>{
              const sp = SP_TYPES.find(t=>t.id===block.type)||SP_TYPES[1];
              const isActive = idx===activeBlock;
